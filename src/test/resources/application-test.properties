spring.application.name=demo-twelven-factor-agentic

# DATABASE (banco isolado para testes — não conflita com chatmemory da aplicação principal)
spring.datasource.url=jdbc:postgresql://localhost:5432/chatmemory_test
spring.datasource.username=chatuser
spring.datasource.password=chatpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# AWS
aws_access_key_id=${AWS_ACCESS_KEY_ID:}
aws_secret_access_key=${AWS_SECRET_ACCESS_KEY:}

# AMAZON BEDROCK
spring.ai.bedrock.aws.region=us-east-1
spring.ai.bedrock.aws.access-key=${AWS_ACCESS_KEY_ID:}
spring.ai.bedrock.aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
spring.ai.bedrock.converse.chat.options.model=amazon.nova-pro-v1:0
spring.ai.bedrock.converse.chat.options.temperature=0.8
spring.ai.bedrock.converse.chat.options.max-tokens=1000

# CHAT MEMORY — cria tabela automaticamente
spring.ai.chat.memory.jdbc.initialize-schema=never
