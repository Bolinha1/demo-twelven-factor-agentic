services:
  postgres:
    image: postgres:16
    container_name: twelven-factor-agentic-db
    environment:
      POSTGRES_DB: chatmemory
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatmemory"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
